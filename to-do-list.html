<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive To-Do List</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f9;
      margin: 0;
      padding: 20px;
      color: #333;
    }

    h1 {
      text-align: center;
      color: #ff9800;
    }

    .todo-container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    input {
      width: 70%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      padding: 10px 15px;
      margin-left: 5px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      background: #ff9800;
      color: white;
      transition: background 0.3s;
    }
    button:hover {
      background: #e68900;
    }

    ul {
      list-style: none;
      padding: 0;
      margin-top: 20px;
    }

    li {
      background: #fafafa;
      margin: 8px 0;
      padding: 10px;
      border-radius: 5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: transform 0.2s;
    }
    li:hover {
      transform: translateX(5px);
    }

    .actions button {
      margin-left: 5px;
      background: #333;
    }
    .actions button:hover {
      background: #555;
    }
  </style>
</head>
<body>
  <h1>My To-Do List</h1>
  <div class="todo-container">
    <input id="taskInput" placeholder="Enter task">
    <button onclick="addTask()">Add</button>
    <ul id="taskList"></ul>
  </div>

  <script>
    let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

    function renderTasks() {
      document.getElementById("taskList").innerHTML = "";
      tasks.forEach((task, i) => {
        document.getElementById("taskList").innerHTML += `
          <li>
            <span>${task}</span>
            <div class="actions">
              <button onclick="editTask(${i})">Edit</button>
              <button onclick="deleteTask(${i})">Delete</button>
            </div>
          </li>`;
      });
    }

    function addTask() {
      let task = document.getElementById("taskInput").value.trim();
      if(task) {
        tasks.push(task);
        localStorage.setItem("tasks", JSON.stringify(tasks));
        document.getElementById("taskInput").value = "";
        renderTasks();
      }
    }

    function deleteTask(i) {
      tasks.splice(i, 1);
      localStorage.setItem("tasks", JSON.stringify(tasks));
      renderTasks();
    }

    function editTask(i) {
      let newTask = prompt("Edit task:", tasks[i]);
      if(newTask !== null && newTask.trim() !== "") {
        tasks[i] = newTask.trim();
        localStorage.setItem("tasks", JSON.stringify(tasks));
        renderTasks();
      }
    }

    renderTasks();
  </script>
</body>
</html>
